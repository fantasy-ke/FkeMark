<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">FkeMark writing workflow</title>
  <desc id="desc">A warm paper graphite diagram showing folder, draft, preview, review, and export workflow.</desc>
  <rect width="1120" height="520" rx="34" fill="#f3eee6"/>
  <path d="M0 96H1120" stroke="#e8dfd2" stroke-width="2"/>
  <circle cx="58" cy="48" r="10" fill="#c96442"/>
  <circle cx="92" cy="48" r="10" fill="#e3b16e"/>
  <circle cx="126" cy="48" r="10" fill="#179fa4"/>
  <text x="170" y="56" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#211c18">FkeMark Markdown Workflow</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(70 158)">
      <rect width="170" height="170" rx="24" fill="#fff" stroke="#d8c8b5" stroke-width="2"/>
      <path d="M42 66h34l16 16h46v48H42z" fill="#e8dfd2" stroke="#c96442" stroke-width="4" stroke-linejoin="round"/>
      <text x="85" y="132" text-anchor="middle" font-size="20" font-weight="800" fill="#211c18">Open Folder</text>
      <text x="85" y="158" text-anchor="middle" font-size="14" fill="#52627a">local .md files</text>
    </g>
    <path d="M260 243h70" stroke="#e3b16e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(350 158)">
      <rect width="170" height="170" rx="24" fill="#fff" stroke="#d8c8b5" stroke-width="2"/>
      <text x="42" y="64" font-size="32" font-weight="900" fill="#c96442">#</text>
      <rect x="42" y="84" width="90" height="10" rx="5" fill="#d8c8b5"/>
      <rect x="42" y="108" width="110" height="10" rx="5" fill="#e8dfd2"/>
      <rect x="42" y="132" width="72" height="10" rx="5" fill="#e8dfd2"/>
      <text x="85" y="158" text-anchor="middle" font-size="20" font-weight="800" fill="#211c18">Draft</text>
    </g>
    <path d="M540 243h70" stroke="#e3b16e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(630 158)">
      <rect width="170" height="170" rx="24" fill="#fff" stroke="#d8c8b5" stroke-width="2"/>
      <rect x="38" y="50" width="94" height="16" rx="8" fill="#c96442"/>
      <rect x="38" y="82" width="118" height="10" rx="5" fill="#e8dfd2"/>
      <rect x="38" y="106" width="90" height="10" rx="5" fill="#e8dfd2"/>
      <rect x="38" y="130" width="112" height="10" rx="5" fill="#e8dfd2"/>
      <text x="85" y="158" text-anchor="middle" font-size="20" font-weight="800" fill="#211c18">Live / Read</text>
    </g>
    <path d="M820 243h70" stroke="#e3b16e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(910 158)">
      <rect width="170" height="170" rx="24" fill="#fff" stroke="#d8c8b5" stroke-width="2"/>
      <circle cx="60" cy="72" r="20" fill="#e8dfd2" stroke="#c96442" stroke-width="4"/>
      <path d="M74 86l30 30" stroke="#c96442" stroke-width="6" stroke-linecap="round"/>
      <rect x="42" y="132" width="86" height="12" rx="6" fill="#d8c8b5"/>
      <text x="85" y="158" text-anchor="middle" font-size="20" font-weight="800" fill="#211c18">Review / Export</text>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#e3b16e"/>
    </marker>
  </defs>
</svg>
