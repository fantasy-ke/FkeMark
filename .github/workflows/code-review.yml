name: AI Code Review

on:
  push:
    branches:
      - dev
  # fork PR 需要从默认分支读取密钥；固定官方 Action 只读取 Git 差异，不执行 PR 代码。
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  OCR_VERSION: ${{ vars.OCR_VERSION || '1.7.17' }}
  AI_API_URL: ${{ vars.AI_API_URL }}
  AI_MODEL: ${{ vars.AI_MODEL }}
  AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
  OCR_USE_ANTHROPIC: ${{ vars.OCR_USE_ANTHROPIC }}

jobs:
  review:
    name: Review pushed changes with OpenCodeReview
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install OpenCodeReview
        shell: bash
        run: |
          if ! [[ "$OCR_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid OCR_VERSION: ${OCR_VERSION}"
            exit 1
          fi
          npm install -g --no-audit --no-fund "@alibaba-group/open-code-review@${OCR_VERSION}"
          ocr version || true

      - name: Generate OpenCodeReview report
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT_PATH="ai-code-review-report.md"
          RAW_OUTPUT_PATH="/tmp/open-code-review-output.txt"
          CLEAN_OUTPUT_PATH="/tmp/open-code-review-output.clean.txt"
          FORMATTED_OUTPUT_PATH="/tmp/open-code-review-output.formatted.md"
          RAW_STDERR_PATH="/tmp/open-code-review-stderr.raw.log"
          STDERR_PATH="open-code-review-stderr.log"
          : > "$RAW_STDERR_PATH"
          : > "$STDERR_PATH"

          sanitize_ocr_output() {
            node - "$1" "$2" <<'NODE'
          const fs = require('fs');
          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          let text = fs.existsSync(inputPath) ? fs.readFileSync(inputPath, 'utf8') : '';
          text = text
            .replace(/\u001b\][\s\S]*?(?:\u0007|\u001b\\)/g, '')
            .replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '')
            .replace(/\u009b[0-?]*[ -/]*[@-~]/g, '')
            .replace(/\uFFFD\[[0-?]*[ -/]*[@-~]/g, '')
            .replace(/\r/g, '');
          const lines = text.split('\n').filter((line) => {
            const trimmed = line.trim();
            if (!trimmed) return true;
            if (/^\[ocr\]\s+/i.test(trimmed)) return false;
            return true;
          });
          text = lines.join('\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
          fs.writeFileSync(outputPath, text ? `${text}\n` : '', 'utf8');
          NODE
          }

          format_ocr_report() {
            node - "$1" "$2" <<'NODE'
          const fs = require('fs');
          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          const text = fs.existsSync(inputPath) ? fs.readFileSync(inputPath, 'utf8') : '';
          const output = [];
          let inCodeBlock = false;

          const closeCodeBlock = () => {
            if (!inCodeBlock) return;
            output.push('```');
            inCodeBlock = false;
          };

          const HEADING_RE = /^\u2500\u2500\u2500\s+(.+?)\s+\u2500\u2500\u2500$/;
          const SEVERITY_RANK = new Map([
            ['critical', 0],
            ['blocker', 0],
            ['high', 1],
            ['major', 1],
            ['medium', 2],
            ['moderate', 2],
            ['normal', 2],
            ['low', 3],
            ['minor', 3],
            ['info', 4],
            ['informational', 4],
            ['suggestion', 4],
            ['nit', 5],
          ]);
          const SEVERITY_RE = /\[[^\]\n]*?\b(critical|blocker|high|major|medium|moderate|normal|low|minor|info|informational|suggestion|nit)\b[^\]\n]*\]/i;
          const CODE_FRAGMENT_RE = /[\`"'{};=<>]|^\s*(?:const|let|var|function|return|if|for|while|switch|class|interface|type|import|export|await|async|using|namespace|public|private|protected|internal|static|void|new)\b|^\s*[\w.-]+\s*:/;

          const getSeverityRank = (lines) => {
            const match = lines.join('\n').match(SEVERITY_RE);
            if (!match) return Number.MAX_SAFE_INTEGER;
            return SEVERITY_RANK.get(match[1].toLowerCase()) ?? Number.MAX_SAFE_INTEGER;
          };

          const sortReviewBlocks = (value) => {
            const prefix = [];
            const blocks = [];
            let currentBlock = null;

            for (const line of value.split('\n')) {
              if (HEADING_RE.test(line)) {
                if (currentBlock) blocks.push(currentBlock);
                currentBlock = [line];
                continue;
              }

              if (currentBlock) {
                currentBlock.push(line);
              } else {
                prefix.push(line);
              }
            }

            if (currentBlock) blocks.push(currentBlock);
            if (blocks.length < 2) return value;

            const sortedBlocks = blocks
              .map((lines, index) => ({ lines, index, rank: getSeverityRank(lines) }))
              .sort((a, b) => a.rank - b.rank || a.index - b.index)
              .flatMap((block) => block.lines);

            const lines = [...prefix];
            if (lines.length && lines[lines.length - 1] !== '') lines.push('');
            lines.push(...sortedBlocks);
            return lines.join('\n');
          };

          const isCodeContent = (value) => CODE_FRAGMENT_RE.test(value.trim());

          const isDiffLine = (line) => {
            const match = line.match(/^([+-])(.*)$/);
            if (!match) return false;
            const content = match[2];
            return content.length > 0 && (!/^\s/.test(content) || isCodeContent(content));
          };

          const isCodeLikeLine = (line) => {
            if (!line.trim()) return false;
            return isDiffLine(line) || (/^\s{2,}\S/.test(line) && isCodeContent(line));
          };

          const isCodeContinuationLine = (line) => /^\s/.test(line) || isCodeContent(line);

          for (const line of sortReviewBlocks(text).split('\n')) {
            const heading = line.match(HEADING_RE);
            if (heading) {
              closeCodeBlock();
              if (output.length && output[output.length - 1] !== '') output.push('');
              output.push(`### \`${heading[1]}\``);
              continue;
            }

            if (isCodeLikeLine(line)) {
              if (!inCodeBlock) {
                if (output.length && output[output.length - 1] !== '') output.push('');
                output.push('```diff');
                inCodeBlock = true;
              }
              output.push(line);
              continue;
            }

            if (inCodeBlock && line.trim() && isCodeContinuationLine(line)) {
              output.push(line);
              continue;
            }

            closeCodeBlock();
            output.push(line);
          }

          closeCodeBlock();
          const formatted = output.join('\n').replace(/\n{3,}/g, '\n\n').trim();
          fs.writeFileSync(outputPath, formatted ? `${formatted}\n` : '', 'utf8');
          NODE
          }

          write_report_header() {
            {
              echo "# OpenCodeReview Code Review Report"
              echo
              echo "- **Repository**: ${REPOSITORY}"
              echo "- **Branch**: ${BRANCH_NAME}"
              echo "- **Commit**: \`${AFTER_SHA}\`"
              echo "- **Review range**: \`${REVIEW_RANGE:-unknown}\`"
              echo "- **Model**: \`${AI_MODEL:-not configured}\`"
              echo "- **Tool**: \`@alibaba-group/open-code-review@${OCR_VERSION}\`"
              echo "- **Generated at**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo
            } > "$REPORT_PATH"
          }

          RAW_TIMEOUT_MS="${AI_TIMEOUT_MS:-600000}"
          if ! [[ "$RAW_TIMEOUT_MS" =~ ^[1-9][0-9]*$ ]]; then
            REVIEW_RANGE="${BEFORE_SHA:-unknown}..${AFTER_SHA}"
            write_report_header
            {
              echo "## Review failed"
              echo
              echo "AI_TIMEOUT_MS must be an integer millisecond value greater than 0."
            } >> "$REPORT_PATH"
            exit 1
          fi

          OCR_TIMEOUT_SECONDS=$(( (RAW_TIMEOUT_MS + 999) / 1000 ))
          OCR_TASK_TIMEOUT_MINUTES=$(( (RAW_TIMEOUT_MS + 59999) / 60000 ))

          missing=()
          [ -z "${AI_API_URL:-}" ] && missing+=("vars.AI_API_URL")
          [ -z "${AI_API_KEY:-}" ] && missing+=("secrets.AI_API_KEY")
          [ -z "${AI_MODEL:-}" ] && missing+=("vars.AI_MODEL")
          if [ "${#missing[@]}" -gt 0 ]; then
            REVIEW_RANGE="${BEFORE_SHA:-unknown}..${AFTER_SHA}"
            write_report_header
            {
              echo "## Review failed"
              echo
              echo "Missing required configuration: ${missing[*]}."
            } >> "$REPORT_PATH"
            exit 1
          fi

          export OCR_LLM_URL="$AI_API_URL"
          export OCR_LLM_TOKEN="$AI_API_KEY"
          export OCR_LLM_MODEL="$AI_MODEL"
          export OCR_USE_ANTHROPIC="${OCR_USE_ANTHROPIC:-false}"
          export OCR_LLM_TIMEOUT="$OCR_TIMEOUT_SECONDS"
          export NO_COLOR=1
          export FORCE_COLOR=0
          export TERM=dumb

          if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            REVIEW_RANGE="${BEFORE_SHA}..${AFTER_SHA}"
            REVIEW_ARGS=(review --from "$BEFORE_SHA" --to "$AFTER_SHA")
          else
            REVIEW_RANGE="$AFTER_SHA"
            REVIEW_ARGS=(review --commit "$AFTER_SHA")
          fi

          ocr config set language "Chinese"

          set +e
          ocr "${REVIEW_ARGS[@]}" \
            --format text \
            --audience agent \
            --timeout "$OCR_TASK_TIMEOUT_MINUTES" \
            > "$RAW_OUTPUT_PATH" \
            2> "$RAW_STDERR_PATH"
          OCR_EXIT_CODE=$?
          set -e

          sanitize_ocr_output "$RAW_OUTPUT_PATH" "$CLEAN_OUTPUT_PATH"
          sanitize_ocr_output "$RAW_STDERR_PATH" "$STDERR_PATH"
          format_ocr_report "$CLEAN_OUTPUT_PATH" "$FORMATTED_OUTPUT_PATH"

          write_report_header
          {
            echo "- **Request timeout**: ${OCR_TIMEOUT_SECONDS} seconds"
            echo "- **Task timeout**: ${OCR_TASK_TIMEOUT_MINUTES} minutes"
            echo
            echo "---"
            echo
            if [ "$OCR_EXIT_CODE" -eq 0 ]; then
              if [ -s "$CLEAN_OUTPUT_PATH" ]; then
                cat "$FORMATTED_OUTPUT_PATH"
              else
                echo "OpenCodeReview did not output review findings."
              fi
            else
              echo "## Review failed"
              echo
              echo "OpenCodeReview exited with code ${OCR_EXIT_CODE}."
              if [ -s "$STDERR_PATH" ]; then
                echo
                echo '```text'
                cat "$STDERR_PATH"
                echo '```'
              fi
            fi
          } >> "$REPORT_PATH"

          if [ "$OCR_EXIT_CODE" -ne 0 ]; then
            echo "::error::OpenCodeReview review failed. See ${REPORT_PATH} for details."
            if [ -s "$STDERR_PATH" ]; then
              echo "::group::OpenCodeReview stderr"
              cat "$STDERR_PATH"
              echo "::endgroup::"
            fi
          else
            echo "OpenCodeReview report generated at ${REPORT_PATH}."
          fi
          exit "$OCR_EXIT_CODE"

      - name: Add report to Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f ai-code-review-report.md ]; then
            cat ai-code-review-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# OpenCodeReview code review failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No review report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: ${{ always() && hashFiles('ai-code-review-report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-code-review-${{ github.sha }}
          path: |
            ai-code-review-report.md
            open-code-review-stderr.log
          retention-days: 7

      - name: Comment report on commit
        if: ${{ always() && hashFiles('ai-code-review-report.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ai-code-review-report.md', 'utf8');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const suffix = `\n\n[View the Actions run](${runUrl})`;
            const maxLength = 60000;
            const overflowNotice = '\n\n> Report is too long. See the workflow artifact for the full content.';
            const maxContentLength = Math.max(0, maxLength - suffix.length - overflowNotice.length);
            const truncatedBody = maxContentLength > 0
              ? `${report.slice(0, maxContentLength)}${overflowNotice}${suffix}`
              : `Report exceeds maximum comment length. See the workflow artifact for the full content.${suffix}`;
            const body = report.length + suffix.length > maxLength
              ? truncatedBody
              : `${report}${suffix}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

  pull-request-review:
    name: Review pull request with OpenCodeReview
    # 草稿 PR 的 synchronize 事件会触发但 draft 为 true，跳过审查；ready_for_review 后开始审查。
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Convert review timeout
        id: review-config
        shell: bash
        env:
          RAW_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
        run: |
          raw_timeout_ms="${RAW_TIMEOUT_MS:-600000}"
          if ! [[ "$raw_timeout_ms" =~ ^[1-9][0-9]*$ ]]; then
            echo "AI_TIMEOUT_MS must be an integer millisecond value greater than 0."
            exit 1
          fi
          max_timeout_ms=1620000
          if [ "${#raw_timeout_ms}" -gt "${#max_timeout_ms}" ] || (( raw_timeout_ms > max_timeout_ms )); then
            echo "AI_TIMEOUT_MS exceeds maximum (${max_timeout_ms}ms), clamping."
            raw_timeout_ms=$max_timeout_ms
          fi
          echo "timeout_seconds=$(( (raw_timeout_ms + 999) / 1000 ))" >> "$GITHUB_OUTPUT"

      - name: Review pull request and post comments
        uses: alibaba/open-code-review@0ced7165718725e15223c3e5a506df7b7e9de51f # v1.7.17
        with:
          llm_url: ${{ vars.AI_API_URL }}
          llm_auth_token: ${{ secrets.AI_API_KEY }}
          llm_model: ${{ vars.AI_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_USE_ANTHROPIC || 'false' }}
          llm_extra_body: '{}'
          llm_timeout: ${{ steps.review-config.outputs.timeout_seconds }}
          language: Chinese
          github_token: ${{ github.token }}
          ocr_version: ${{ vars.OCR_VERSION || '1.7.17' }}
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'false'
