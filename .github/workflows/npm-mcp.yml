name: Publish MCP npm Package

# 发布 fkemark-mcp-server 独立 npm CLI 包，供外部 Agent 通过 npx 或全局命令启动。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要打包的 npm 版本号，例如 0.2.3'
        required: true
        type: string
      publish:
        description: '是否发布到 npm；默认只上传 tarball artifact'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # 上传 tarball 需要 actions 写权限；npm provenance 需要 id-token，缺了会在发布命令里抛权限异常。
  actions: write
  id-token: write

env:
  PACKAGE_DIR: packages/fkemark-mcp-server
  PACK_DIR: mcp-npm-package

jobs:
  publish:
    name: Pack and publish MCP CLI
    runs-on: ubuntu-22.04
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Resolve package version
        id: meta
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${MANUAL_VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "[ERROR] Invalid npm version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[INFO] MCP npm package version: $VERSION"

      - name: Write package version
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Validate package entry
        run: node -c "$PACKAGE_DIR/bin/fkemark-mcp-server.cjs"

      - name: Pack npm tarball
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/${PACK_DIR}"
          npm pack --pack-destination "${GITHUB_WORKSPACE}/${PACK_DIR}"
          ls -lh "${GITHUB_WORKSPACE}/${PACK_DIR}"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fkemark-mcp-server-${{ steps.meta.outputs.version }}
          path: ${{ env.PACK_DIR }}/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Resolve publish mode
        id: publish-mode
        shell: bash
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          PUBLISH=false
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            PUBLISH=true
          elif [[ "${MANUAL_PUBLISH:-false}" == "true" ]]; then
            PUBLISH=true
          fi
          if [[ "$PUBLISH" == "true" && -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "[WARN] npm publish requested but NPM_TOKEN is not configured; uploaded the npm tarball artifact only."
            PUBLISH=false
          fi
          echo "enabled=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "[INFO] Publish to npm: $PUBLISH"

      - name: Publish to npm
        if: steps.publish-mode.outputs.enabled == 'true'
        working-directory: ${{ env.PACKAGE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          publish_once() {
            set +e
            OUTPUT="$(npm publish --access public "$@" 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"
          }
          publish_once
          if [[ "$STATUS" -ne 0 ]] && printf '%s' "$OUTPUT" | grep -Eiq 'provenance|id-token|EOIDC|ACTIONS_ID_TOKEN'; then
            echo "[WARN] Provenance or id-token permission failed; retrying npm publish without provenance."
            NPM_CONFIG_PROVENANCE=false publish_once
          fi
          if [[ "$STATUS" -eq 0 ]]; then
            echo "[INFO] Published fkemark-mcp-server to npm."
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -Eiq 'EPUBLISHCONFLICT|cannot publish over|previously published'; then
            echo "::warning::npm version is already published; kept the uploaded tarball artifact."
            echo "[WARN] Version already published; uploaded the npm tarball artifact only."
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -Eiq 'E401|E403|ENEEDAUTH|EPERM|EACCES|forbidden|unauthorized|permission denied|need auth|two-factor|granular access token'; then
            echo "::warning::NPM_TOKEN cannot publish this package. Check publish permission, 2FA bypass, and id-token. Uploaded the tarball artifact only."
            echo "[WARN] npm publish permission or auth error; uploaded the npm tarball artifact only."
            exit 0
          fi
          echo "::error::npm publish failed with an unexpected error. See the step log."
          echo "[ERROR] npm publish failed."
          exit "$STATUS"

      - name: Skip npm publish without publish mode
        if: steps.publish-mode.outputs.enabled != 'true'
        run: echo "[INFO] Uploaded the npm tarball artifact only; npm publish was not requested or NPM_TOKEN is missing."
