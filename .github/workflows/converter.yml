name: Document converter component

on:
  push:
    tags: ['converter-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: 校验组件版本号
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          if ! [[ "$GITHUB_REF_NAME" =~ ^converter-v${number}\.${number}\.${number}$ ]]; then
            echo '组件标签应为 converter-vX.Y.Z，版本号不得有前导零。' >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      FKEMARK_CONVERTER_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            converter/requirements*.txt
            converter/constraints.txt
      - run: npm ci
      - run: node --test converter/build_scripts_test.cjs
      - run: npm run converter:build
      - run: npm run converter:package
      - uses: actions/upload-artifact@v4
        with:
          name: converter-${{ matrix.target }}
          path: converter/.build/FkeMark-converter-p1-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: converter-*
          path: components
          merge-multiple: true
      - name: 发布独立组件，不替换应用更新渠道
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(components/FkeMark-converter-p1-*.tar.gz)
          test "${#assets[@]}" = 4
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --prerelease \
            --title "FkeMark 文档转换组件 ${GITHUB_REF_NAME#converter-}" \
            --notes '在 FkeMark 的「设置 → 组件」中按平台下载安装。支持文本 PDF 标题识别和离线简体中文、英文图片 OCR。' \
            "${assets[@]}"
